# NiceIdeas staging — proxied by Cloudflare (SSL mode "full"); origin cert /etc/ssl/niceideas.app.*
server {
    listen 80;
    listen [::]:80;
    server_name t.niceideas.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name t.niceideas.app;

    ssl_certificate     /etc/ssl/niceideas.app.pem;
    ssl_certificate_key /etc/ssl/niceideas.app.key;

    # Media uploads (audio up to 150 MB) stream straight to the app.
    client_max_body_size 160m;
    proxy_request_buffering off;

    location / {
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://127.0.0.1:3110;
    }
}
