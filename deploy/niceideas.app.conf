# NiceIdeas production — niceideas.app on prod2, proxied by Cloudflare (SSL mode "full"); origin cert /etc/ssl/niceideas.app.*
server {
    listen 80;
    listen [::]:80;
    server_name niceideas.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name niceideas.app;

    ssl_certificate     /etc/ssl/niceideas.app.pem;
    ssl_certificate_key /etc/ssl/niceideas.app.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cloudflare real IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Media uploads (audio up to 150 MB) stream straight to the app.
    client_max_body_size 160m;
    proxy_request_buffering off;

    location / {
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://127.0.0.1:3120;
    }
}
